<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firebase Test</title>
<style>
body{background:#0A2540;color:#fff;font-family:monospace;padding:20px;font-size:14px}
#dot{width:20px;height:20px;border-radius:50%;background:gray;margin:10px 0;display:inline-block}
#dot.ok{background:#1DB954} #dot.sync{background:#F4A261;animation:p .5s infinite alternate}
#dot.err{background:#E63946}
@keyframes p{from{opacity:.3}to{opacity:1}}
pre{background:rgba(255,255,255,.1);padding:12px;border-radius:8px;white-space:pre-wrap;word-break:break-all;font-size:12px}
</style>
</head>
<body>
<h2>Firebase Test 🔥</h2>
<div>Status: <span id="dot"></span> <span id="status">Iniciando...</span></div>
<pre id="log">aguardando...</pre>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
var logs = [];
function log(msg, ok) {
  var t = new Date().toLocaleTimeString();
  logs.push('['+t+'] ' + msg);
  document.getElementById('log').textContent = logs.join('\n');
  document.getElementById('status').textContent = msg;
  var d = document.getElementById('dot');
  d.className = ok === true ? 'ok' : ok === false ? 'err' : 'sync';
}

log('Carregando Firebase SDKs...');

try {
  firebase.initializeApp({
    apiKey:            "AIzaSyCA4z_LJhQ1ZK-YAZgjnYfxKrjZx8iz-G8",
    authDomain:        "gastocerto-7da6d.firebaseapp.com",
    projectId:         "gastocerto-7da6d",
    storageBucket:     "gastocerto-7da6d.firebasestorage.app",
    messagingSenderId: "264328179853",
    appId:             "1:264328179853:web:5f8deb2cc373f85149b2c4"
  });
  log('Firebase inicializado ✅');
} catch(e) {
  log('Erro init: ' + e.message, false);
}

var auth = firebase.auth();
var db   = firebase.firestore();

log('Fazendo login anônimo...');
auth.signInAnonymously()
  .then(function(r) {
    log('Auth OK! UID: ' + r.user.uid, true);
    // Test write
    return db.collection('test').doc('ping').set({
      ts: new Date().toISOString(),
      from: location.hostname
    });
  })
  .then(function() {
    log('Firestore WRITE OK ✅', true);
    // Test read
    return db.collection('test').doc('ping').get();
  })
  .then(function(snap) {
    log('Firestore READ OK ✅ data: ' + JSON.stringify(snap.data()), true);
  })
  .catch(function(e) {
    log('ERRO: ' + e.code + ' — ' + e.message, false);
  });
</script>
</body>
</html>
